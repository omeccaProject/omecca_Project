server:
  port: 8080
  error:
    include-message: always

gateway:
  api-key: ${GATEWAY_API_KEY}

app:
  # 업로드된 동영상(카메라 등록용)을 저장할 디렉터리. b_gateway 실행 위치 기준 상대경로.
  # StaticResourceConfig/CameraService.uploadVideo가 이 값을 그대로 공유한다.
  upload-dir: ${UPLOAD_DIR:uploads}
  auth:
    jwt-secret: ${JWT_SECRET}

# 대시보드 "📄 PDF 리포트 생성" 버튼이 눌렸을 때 b_report(PDF 증거 리포트 생성기)를
# 그 자리에서 호출하는 기능 (ReportGenerationService 참고). 이벤트가 생길 때마다
# 자동으로 만드는 게 아니라, 관제요원이 상세화면에서 버튼을 눌렀을 때만 생성한다.
# 전부 기본값이 있어서 아무것도 설정 안 해도 동작한다 - b_report가 없거나 파이썬 의존성이
# 안 깔려있으면 버튼 눌렀을 때 명확한 에러 메시지만 뜨고, 서버 자체엔 영향 없다.
# 끄고 싶으면 환경변수 REPORT_GENERATION_ENABLED=false 로 실행하면 된다.
report:
  generation:
    enabled: ${REPORT_GENERATION_ENABLED:true}
    # b_gateway 실행 위치(보통 b_gateway/) 기준 상대경로. omecca_Project 하위에
    # b_gateway/b_report/b_dashboard가 형제 폴더라는 구조를 그대로 가정한다.
    project-dir: ${REPORT_PROJECT_DIR:../b_report}
    frame-base-dir: ${REPORT_FRAME_BASE_DIR:../b_dashboard/public}
    gateway-url: ${REPORT_GATEWAY_URL:http://localhost:8080}
    python-executable: ${REPORT_PYTHON_EXECUTABLE:python3}


spring:
  application:
    name: omecca-backend
  # 동영상을 "CCTV"로 업로드 등록하는 기능(CameraController.upload)용. 기본값(1MB)으론 영상이
  # 바로 413으로 거부되므로 상향해둔다.
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    # createDatabaseIfNotExist=true : omecca 데이터베이스가 없으면 만들고 붙는다.
    #   Flyway 는 DB '안의 테이블'을 관리할 뿐 DB 자체는 못 만든다. 이게 없으면
    #   새로 받은 사람마다 CREATE DATABASE 를 손으로 쳐야 하고, 그러면 Flyway 를
    #   붙인 이유(각자 SQL 돌리는 번거로움 제거)가 절반만 해결된다.
    #   MySQL 8 의 서버 기본 문자셋이 utf8mb4 라 한글도 그대로 들어간다
    #   (확인: d_lpr/check_mysql.py 6단계 한글 왕복 검사).
    url: jdbc:mysql://localhost:3306/omecca?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Flyway 가 테이블을 만들고 Hibernate 는 검증만 한다 (Spring Boot 가 순서를 보장).
      # create 로 바꾸면 Hibernate 가 스키마를 덮어써서 Flyway 이력과 어긋난다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  # DB 스키마 자동 적용.
  #   db/migration/V1__baseline.sql    camera, camera_catalog, target, roi, event, report, user
  #   db/migration/V2__lpr_tables.sql  vehicle, plate_read_log   (d_lpr)
  #   db/migration/V3__lpr_seed.sql    시연용 차량 12대
  #
  # 앱을 켤 때마다 "아직 적용 안 된 것"만 순서대로 돌린다. 다 돼 있으면 아무 일도
  # 일어나지 않는다. 기존 schema.sql / migration_*.sql 을 손으로 돌릴 필요가 없다.
  flyway:
    enabled: true
    # 이미 테이블이 있는 DB 도 멈추지 않고 합류시킨다 (V1 은 적용된 것으로 간주).
    baseline-on-migrate: true
    baseline-version: 0
    # flyway clean 은 스키마의 **모든 테이블**을 지운다. vehicle 까지 날아간다. 반드시 막는다.
    clean-disabled: true

logging:
  level:
    com.omecca.omeccabackend: INFO
