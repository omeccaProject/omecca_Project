server:
  port: 8080
  error:
    include-message: always
  # [버그 수정: "영상 업로드에 실패했습니다"] POST /api/cameras/upload(CameraController.upload,
  # MultipartFile)가 이 값을 설정하지 않으면 Spring Boot 기본값(max-file-size 1MB /
  # max-request-size 10MB)이 그대로 적용된다 - CCTV용 mp4는 보통 이보다 훨씬 크므로
  # 파일이 조금만 커도 MaxUploadSizeExceededException으로 500이 나고, 프론트(api.js의
  # uploadCameraVideo → parseErrorMessage)는 그 응답이 JSON이 아니라서 파싱에 실패해
  # 화면엔 그냥 "영상 업로드에 실패했습니다."라는 일반 문구만 뜬다(실제 원인은 용량 제한).
  # Tomcat 자체의 max-swallow-size도 별도 기본값(2MB)이 있어서, multipart 쪽만 늘리면
  # 업로드 도중 커넥션이 끊기는 경우가 생길 수 있어 같이 늘려준다.
  tomcat:
    max-swallow-size: 500MB

gateway:
  api-key: ${GATEWAY_API_KEY}

app:
  auth:
    jwt-secret: ${JWT_SECRET}
  # [추가] 수배자 얼굴 등록(WantedPersonService) - c_person_risk 파이썬 스크립트를
  # 실행할 때 필요한 설정. report.generation과 동일한 패턴이다.
  # [중요] 자바 프로세스는 venv 개념을 모르므로, python-executable을 그냥
  # "python"/"python3"로 두면 시스템 기본 파이썬으로 실행되어
  # "ModuleNotFoundError: No module named 'face_recognition'"이 난다
  # (camera_watcher.py를 venv 활성화 없이 실행했을 때와 동일한 원인).
  # 반드시 .env에 WANTED_PERSON_PYTHON_EXECUTABLE로 본인 venv의 python.exe
  # 절대경로를 설정할 것 (DB_USERNAME/PASSWORD처럼 팀 공용 값이 아니라 본인 로컬 값).
  wanted-person:
    project-dir: ${WANTED_PERSON_PROJECT_DIR:../c_person_risk}
    python-executable: ${WANTED_PERSON_PYTHON_EXECUTABLE:python}

# 대시보드 "📄 PDF 리포트 생성" 버튼이 눌렸을 때 b_report(PDF 증거 리포트 생성기)를
# 그 자리에서 호출하는 기능 (ReportGenerationService 참고). 이벤트가 생길 때마다
# 자동으로 만드는 게 아니라, 관제요원이 상세화면에서 버튼을 눌렀을 때만 생성한다.
# 전부 기본값이 있어서 아무것도 설정 안 해도 동작한다 - b_report가 없거나 파이썬 의존성이
# 안 깔려있으면 버튼 눌렀을 때 명확한 에러 메시지만 뜨고, 서버 자체엔 영향 없다.
# 끄고 싶으면 환경변수 REPORT_GENERATION_ENABLED=false 로 실행하면 된다.
report:
  generation:
    enabled: ${REPORT_GENERATION_ENABLED:true}

    # b_gateway 실행 위치(보통 b_gateway/) 기준 상대경로.
    # omecca_Project 하위에 b_gateway/b_report/b_dashboard가 형제 폴더라는 구조를 그대로 가정한다.
    project-dir: ${REPORT_PROJECT_DIR:../b_report}
    frame-base-dir: ${REPORT_FRAME_BASE_DIR:../b_dashboard/public}
    gateway-url: ${REPORT_GATEWAY_URL:http://localhost:8080}
    # [참고] 이것도 wanted-person과 동일한 venv 이슈가 있을 수 있음 - python3가 시스템에
    # 없거나 face_recognition/reportlab 등 의존성이 venv에만 있으면 PDF 생성도 실패할 수
    # 있다. 필요하면 .env에 REPORT_PYTHON_EXECUTABLE로 venv 절대경로를 지정할 것.
    python-executable: ${REPORT_PYTHON_EXECUTABLE:python3}

spring:
  application:
    name: omecca-backend
  servlet:
    multipart:
      # 위 server.tomcat.max-swallow-size와 짝을 이루는 설정 - 이게 없으면 아무리
      # tomcat 쪽을 늘려도 Spring 쪽에서 먼저 1MB/10MB로 막는다.
      max-file-size: 500MB
      max-request-size: 500MB

  datasource:
    # [버그 수정] 예전에 깃 merge conflict를 풀면서 실수로 카페24 주소가 하드코딩돼서
    # .env에서 DB_HOST/DB_PORT/DB_NAME을 아무리 바꿔도(로컬 DB로 전환해도) 항상 카페24로만
    # 접속하려던 문제가 있었다. C_실행가이드.md 원래 설계대로 환경변수 미설정 시
    # localhost:3306/omecca(로컬)로 기본 접속하고, DB_HOST 등을 넣으면(카페24 공용 DB 테스트 시)
    # 그 값을 쓰도록 복원.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:omecca}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

logging:
  level:
    com.omecca.omeccabackend: INFO