<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>차량 위반 현황 관제 · 오메카3</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2430; --line:#293040;
    --text:#e6edf3; --muted:#8b949e;
    --high:#f85149; --caution:#e3b341; --normal:#3fb950; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;}
  header{display:flex;align-items:center;justify-content:space-between;
         padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0;letter-spacing:-.3px}
  h1 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
  .conn{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:#484f58}
  .dot.on{background:var(--normal);box-shadow:0 0 8px var(--normal)}
  main{padding:18px 22px;max-width:1500px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card .k{font-size:11px;color:var(--muted);letter-spacing:.3px}
  .card .v{font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
  .card.high .v{color:var(--high)} .card.warn .v{color:var(--caution)} .card.ok .v{color:var(--normal)}
  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin-bottom:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .panel h2{font-size:13px;margin:0 0 12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .chart-wrap{position:relative;height:230px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);
     position:sticky;top:0;background:var(--panel)}
  td{padding:8px;border-bottom:1px solid #1f2430;vertical-align:top}
  tbody tr:hover{background:var(--panel2)}
  .scroll{max-height:340px;overflow:auto}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .t-red{background:rgba(248,81,73,.15);color:var(--high)}
  .t-uturn{background:rgba(227,179,65,.15);color:var(--caution)}
  .t-risk{background:rgba(163,113,247,.18);color:#a371f7}
  .r-high{color:var(--high);font-weight:600}
  .r-caution{color:var(--caution)}
  .r-normal{color:var(--muted)}
  .plate{font-family:ui-monospace,Consolas,monospace;font-weight:600;letter-spacing:.5px}
  .muted{color:var(--muted)}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
  .feed{max-height:340px;overflow:auto}
  .feed .item{padding:9px 10px;border-left:3px solid var(--line);margin-bottom:7px;
              background:var(--panel2);border-radius:0 6px 6px 0;font-size:12.5px}
  .feed .item.high{border-left-color:var(--high)}
  .feed .item.red_light{border-left-color:var(--high)}
  .feed .item.illegal_uturn{border-left-color:var(--caution)}
  .feed .item .t{color:var(--muted);font-size:11px}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  select,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);
                border-radius:6px;padding:6px 11px;font-size:12px;cursor:pointer}
  button:hover,select:hover{border-color:var(--accent)}
  @media(max-width:1000px){.grid,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>차량 위반 현황 관제 <small>번호판 인식 · 신호위반 · 불법유턴 | 오메카3</small></h1>
  <div class="conn"><span class="dot" id="dot"></span><span id="connTxt">연결 대기</span></div>
</header>

<main>
  <div class="cards" id="cards"></div>

  <div class="grid">
    <div class="panel">
      <h2>시간대별 위반 발생</h2>
      <div class="chart-wrap"><canvas id="chHour"></canvas></div>
    </div>
    <div class="panel">
      <h2>위반 유형 비중</h2>
      <div class="chart-wrap"><canvas id="chType"></canvas></div>
    </div>
  </div>

  <div class="grid3">
    <div class="panel">
      <h2>일자별 추이</h2>
      <div class="chart-wrap" style="height:200px"><canvas id="chDay"></canvas></div>
    </div>
    <div class="panel">
      <h2>카메라별 발생 건수</h2>
      <div class="chart-wrap" style="height:200px"><canvas id="chCam"></canvas></div>
    </div>
    <div class="panel">
      <h2>실시간 경보</h2>
      <div class="feed" id="feed"><div class="empty">수신 대기 중…</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>위반 이벤트 목록</h2>
    <div class="toolbar">
      <select id="fType">
        <option value="">전체 유형</option>
        <option value="red_light">신호 위반</option>
        <option value="illegal_uturn">불법 유턴</option>
        <option value="high_risk_vehicle">고위험 차량</option>
      </select>
      <select id="fRisk">
        <option value="">전체 위험도</option>
        <option value="high">고위험</option>
        <option value="caution">주의</option>
        <option value="normal">일반</option>
      </select>
      <button id="btnReload">새로고침</button>
      <span class="muted" id="cnt"></span>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th style="width:150px">발생 시각</th><th style="width:90px">유형</th>
          <th style="width:100px">번호판</th><th style="width:70px">신뢰도</th>
          <th style="width:90px">카메라</th><th style="width:80px">위험도</th>
          <th>판정 내용</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="7" class="empty">데이터 없음</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const TYPE_META = {
  red_light:        {label:"신호 위반",   cls:"t-red"},
  illegal_uturn:    {label:"불법 유턴",   cls:"t-uturn"},
  high_risk_vehicle:{label:"고위험 차량", cls:"t-risk"},
};
const RISK_LABEL = {high:"고위험", caution:"주의", normal:"일반"};
const C = {high:"#f85149", caution:"#e3b341", normal:"#3fb950", accent:"#58a6ff",
           purple:"#a371f7", grid:"#293040", muted:"#8b949e"};

Chart.defaults.color = C.muted;
Chart.defaults.borderColor = C.grid;
Chart.defaults.font.family = '"Pretendard","Malgun Gothic",system-ui,sans-serif';

let charts = {};

function fmtTime(s){
  if(!s) return "-";
  return String(s).replace("T"," ").slice(0,19);
}
function esc(s){
  return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

// ---------------------------------------------------------------- 요약 카드
function renderCards(s){
  const items = [
    {k:"전체 위반",       v:s.total_violations,                        c:""},
    {k:"고위험 차량",     v:s.high_risk_vehicle,                       c:"high"},
    {k:"신호 위반",       v:s.red_light,                               c:"warn"},
    {k:"불법 유턴",       v:s.illegal_uturn,                           c:"warn"},
    {k:"번호판 인식",     v:s.plate_reads,                             c:""},
    {k:"포맷 유효율",     v:(s.plate_valid_rate*100).toFixed(1)+"%",   c:"ok"},
    {k:"평균 인식 신뢰도", v:(s.plate_avg_confidence*100).toFixed(1)+"%", c:"ok"},
  ];
  document.getElementById("cards").innerHTML = items.map(i =>
    `<div class="card ${i.c}"><div class="k">${i.k}</div><div class="v">${i.v}</div></div>`
  ).join("");
}

// ---------------------------------------------------------------- 차트
function upsert(id, cfg){
  if(charts[id]){ charts[id].destroy(); }
  charts[id] = new Chart(document.getElementById(id), cfg);
}

function renderCharts(d){
  upsert("chHour", {
    type:"bar",
    data:{labels:d.by_hour.map(x=>x.hour+"시"),
          datasets:[{label:"건수", data:d.by_hour.map(x=>x.count),
                     backgroundColor:C.accent, borderRadius:3}]},
    options:{responsive:true, maintainAspectRatio:false,
             plugins:{legend:{display:false}},
             scales:{y:{beginAtZero:true, ticks:{precision:0}}}}
  });

  upsert("chType", {
    type:"doughnut",
    data:{labels:d.by_type.map(x=>x.label),
          datasets:[{data:d.by_type.map(x=>x.count),
                     backgroundColor:[C.high, C.caution, C.purple], borderWidth:0}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:"58%",
             plugins:{legend:{position:"bottom", labels:{boxWidth:12, padding:14}}}}
  });

  upsert("chDay", {
    type:"line",
    data:{labels:d.by_day.map(x=>x.date.slice(5)),
          datasets:[{label:"건수", data:d.by_day.map(x=>x.count),
                     borderColor:C.accent, backgroundColor:"rgba(88,166,255,.15)",
                     fill:true, tension:.3, pointRadius:3}]},
    options:{responsive:true, maintainAspectRatio:false,
             plugins:{legend:{display:false}},
             scales:{y:{beginAtZero:true, ticks:{precision:0}}}}
  });

  upsert("chCam", {
    type:"bar",
    data:{labels:d.by_camera.map(x=>x.cam_id),
          datasets:[{label:"건수", data:d.by_camera.map(x=>x.count),
                     backgroundColor:C.purple, borderRadius:3}]},
    options:{indexAxis:"y", responsive:true, maintainAspectRatio:false,
             plugins:{legend:{display:false}},
             scales:{x:{beginAtZero:true, ticks:{precision:0}}}}
  });
}

// ---------------------------------------------------------------- 표
function renderTable(items){
  document.getElementById("cnt").textContent = `${items.length}건`;
  const tb = document.getElementById("tbody");
  if(!items.length){
    tb.innerHTML = '<tr><td colspan="7" class="empty">데이터 없음</td></tr>';
    return;
  }
  tb.innerHTML = items.map(r => {
    const m = TYPE_META[r.violation_type] || {label:r.violation_type, cls:""};
    const conf = r.plate_confidence ? (r.plate_confidence*100).toFixed(0)+"%" : "-";
    return `<tr>
      <td class="muted">${fmtTime(r.occurred_at)}</td>
      <td><span class="tag ${m.cls}">${m.label}</span></td>
      <td class="plate">${esc(r.plate_no || "-")}</td>
      <td class="muted">${conf}</td>
      <td class="muted">${esc(r.cam_id)}</td>
      <td class="r-${r.risk_level}">${RISK_LABEL[r.risk_level] || r.risk_level}</td>
      <td>${esc(r.detail || "")}</td>
    </tr>`;
  }).join("");
}

// ---------------------------------------------------------------- 실시간 피드
const feedEl = document.getElementById("feed");
let feedCount = 0;
function pushFeed(d){
  if(feedCount === 0) feedEl.innerHTML = "";
  const m = TYPE_META[d.type] || {label:d.type};
  const cls = d.risk_level === "high" ? "high" : (d.type || "");
  const t = new Date((d.timestamp || Date.now()/1000)*1000).toLocaleTimeString("ko-KR");
  const div = document.createElement("div");
  div.className = "item " + cls;
  div.innerHTML = `<div class="t">${t} · ${esc(d.cam_id)}</div>
    <div><b>${m.label}</b> ${d.plate_no ? '<span class="plate">'+esc(d.plate_no)+'</span>' : ''}</div>
    <div class="muted">${esc(d.detail || "")}</div>`;
  feedEl.prepend(div);
  feedCount++;
  while(feedEl.childElementCount > 40) feedEl.lastElementChild.remove();
}

// ---------------------------------------------------------------- 데이터 로드
async function loadStats(){
  const r = await fetch("/api/stats");
  const d = await r.json();
  renderCards(d.summary);
  renderCharts(d);
}

async function loadTable(){
  const t = document.getElementById("fType").value;
  const k = document.getElementById("fRisk").value;
  const qs = new URLSearchParams({limit:"200"});
  if(t) qs.set("type", t);
  if(k) qs.set("risk_level", k);
  const r = await fetch("/api/violations?" + qs);
  const d = await r.json();
  renderTable(d.items || []);
}

async function refresh(){
  try{ await Promise.all([loadStats(), loadTable()]); }
  catch(e){ console.error("갱신 실패", e); }
}

// ---------------------------------------------------------------- WebSocket
function connect(){
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  const dot = document.getElementById("dot");
  const txt = document.getElementById("connTxt");

  ws.onopen = () => { dot.classList.add("on"); txt.textContent = "실시간 연결됨"; };
  ws.onclose = () => {
    dot.classList.remove("on"); txt.textContent = "연결 끊김 · 재시도";
    setTimeout(connect, 3000);
  };
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if(msg.topic === "violation.event"){
      pushFeed(msg.data);
      clearTimeout(window.__deb);
      window.__deb = setTimeout(refresh, 800);   // 연속 수신 시 갱신 묶기
    }
  };
  setInterval(() => { if(ws.readyState === 1) ws.send("ping"); }, 25000);
}

document.getElementById("btnReload").onclick = refresh;
document.getElementById("fType").onchange = loadTable;
document.getElementById("fRisk").onchange = loadTable;

refresh();
connect();
setInterval(refresh, 30000);
</script>
</body>
</html>
